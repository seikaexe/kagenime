<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kagenime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: a phone-sized app shell (top bar area, scrolling screen, bottom tab bar) centered on desktop, full-bleed on phones. */
:root{
  --bg:#FDF7FF; --surface:#FDF7FF; --c-low:#F8F1FA; --c:#F2ECF5; --c-high:#ECE6EF; --c-highest:#E6E0E9;
  --fg:#1D1A22; --fg2:#4A4555; --outline:#6A6474; --outline-v:#CBC3D7;
  --primary:#6A4BC4; --on-primary:#fff; --primary-c:#EBDCFF; --on-primary-c:#240061;
  --secondary:#9C3E5F; --sec-c:#FFD9E3; --tertiary:#006686; --error:#BA1A1A;
  --stage:#E9E2EE; --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0A0F; --surface:#0B0A0F; --c-low:#16141C; --c:#1A1721; --c-high:#1F1C27; --c-highest:#312D39;
  --fg:#E8E0EE; --fg2:#A39DAE; --outline:#958EA1; --outline-v:#2A2633;
  --primary:#D4BBFF; --on-primary:#3A1B76; --primary-c:#52348E; --on-primary-c:#EBDCFF;
  --secondary:#FFB0C9; --sec-c:#2A2238; --tertiary:#8FD3F2; --error:#FFB4AB; --stage:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0A0F; --surface:#0B0A0F; --c-low:#16141C; --c:#1A1721; --c-high:#1F1C27; --c-highest:#312D39;
  --fg:#E8E0EE; --fg2:#A39DAE; --outline:#958EA1; --outline-v:#2A2633;
  --primary:#D4BBFF; --on-primary:#3A1B76; --primary-c:#52348E; --on-primary-c:#EBDCFF;
  --secondary:#FFB0C9; --sec-c:#2A2238; --tertiary:#8FD3F2; --error:#FFB4AB; --stage:#000; color-scheme:dark}
:root[data-amoled="1"]{--bg:#000;--surface:#000;--c-low:#0B0A0F;--c:#121017;--c-high:#1B1821;--c-highest:#25212C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4;
  display:flex;align-items:center;justify-content:center;padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{display:block;flex:none}
.ic{width:24px;height:24px;fill:currentColor}
.app{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column}
@media (min-width:520px) and (min-height:760px){.app{height:min(900px,calc(100% - 32px));border-radius:36px;box-shadow:0 0 0 1px var(--outline-v),0 30px 80px rgba(0,0,0,.45)}}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.view::-webkit-scrollbar{display:none}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1.title{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;padding:14px 20px 8px}
.sub{color:var(--fg2);font-size:13px}
/* tab bar */
nav.tabs{display:flex;justify-content:space-around;background:var(--c-low);padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--outline-v);flex:none}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--fg2);min-width:60px}
nav.tabs .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav.tabs button[aria-current=true]{color:var(--fg);font-weight:800}
nav.tabs button[aria-current=true] .pill{background:var(--primary-c);color:var(--on-primary-c)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--outline-v);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
/* search */
.search{margin:6px 20px 10px;display:flex;align-items:center;gap:10px;border:1px solid var(--outline-v);border-radius:16px;padding:0 14px;height:52px;background:var(--c-low)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:15px;outline:0}
.search:focus-within{border-color:var(--primary)}
/* poster */
.poster{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/3;width:100%;background:var(--c-high);display:flex;align-items:flex-end}
.poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:48px;letter-spacing:-.04em;color:rgba(255,255,255,.28)}
.poster .pt{position:relative;width:100%;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;font-weight:700;line-height:1.2}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;display:flex;gap:5px;align-items:center;backdrop-filter:blur(6px)}
.badge i{width:6px;height:6px;border-radius:50%;background:#ff4d6d}
.badge.new{background:var(--primary);color:var(--on-primary);border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:4px 20px 24px}
.card{text-align:left;display:block;min-width:0}
.card .nm{margin-top:7px;font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .mt{font-size:10px;color:var(--fg2);font-weight:600;letter-spacing:.04em;margin-top:3px;text-transform:uppercase}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:none;width:112px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 8px}
.sec h2{margin:0;font-size:17px;font-weight:700}
.sec button{color:var(--primary);font-weight:700;font-size:13px}
/* home hero */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px 20px;position:absolute;inset:0 0 auto;z-index:3}
.top>span:last-child{display:flex}
.logo{font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo b{color:var(--fg2);font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:rgba(127,127,127,.18)}
.hero{position:relative;padding:68px 20px 18px;text-align:center;overflow:hidden}
.hero .bg{position:absolute;inset:0;filter:blur(36px) saturate(1.2);opacity:.55;transform:scale(1.3)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.hero>*:not(.bg):not(.fade){position:relative}
.hero .pw{width:128px;margin:0 auto 14px;box-shadow:0 12px 36px rgba(0,0,0,.5)}
.hero .rank{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--fg2);font-weight:600}
.hero .rank b{background:var(--primary-c);color:var(--on-primary-c);font-size:10px;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.hero h2{margin:8px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .st{font-size:12px;color:var(--fg2)}
.hero .acts{display:flex;gap:10px;margin-top:16px}
.btn{height:52px;border-radius:26px;background:var(--fg);color:var(--bg);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.pri{background:var(--primary);color:var(--on-primary);border-radius:16px}
.btn.out{background:none;color:var(--fg);border:1px solid var(--outline);height:46px;border-radius:23px;font-size:14px}
.btn:disabled{opacity:.4}
.sq{width:52px;height:52px;border-radius:16px;border:1px solid var(--outline-v);display:grid;place-items:center;flex:none;background:var(--c-low)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--outline-v);transition:width .25s,background .25s}
.dots i.on{width:22px;background:var(--primary)}
/* schedule */
.days{display:flex;border-bottom:1px solid var(--outline-v);overflow-x:auto;scrollbar-width:none;padding:0 12px}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;padding:12px 14px;font-weight:600;color:var(--fg2);position:relative;display:flex;gap:6px;align-items:center}
.days button[aria-selected=true]{color:var(--fg);font-weight:800}
.days button[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.days em{font-style:normal;font-size:10px;background:var(--primary-c);color:var(--on-primary-c);padding:2px 7px;border-radius:9px}
.srow{display:flex;gap:14px;padding:10px 20px;text-align:left;width:100%}
.srow .poster{width:76px;flex:none}
.srow .info{min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.srow .t{font-weight:700;font-size:15px;line-height:1.25}
.time{display:inline-flex;gap:5px;align-items:center;background:var(--primary-c);color:var(--on-primary-c);font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;align-self:flex-start}
.meta{font-size:12px;color:var(--fg2)}
.eye{display:inline-flex;gap:5px;align-items:center;background:var(--c-high);padding:2px 8px;border-radius:9px;font-size:11px;font-weight:600;color:var(--fg2);align-self:flex-start}
/* detail */
.dhead{position:relative;padding:0 20px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end}
.dhead .bg{position:absolute;inset:0;opacity:.8}
.dhead .fade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),transparent 35%,var(--bg) 95%)}
.dhead>*:not(.bg):not(.fade){position:relative}
.dbar{position:sticky;top:0;z-index:5;height:0}
.dbar .iconbtn{position:absolute;top:12px;left:10px;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(8px)}
.dtop{display:flex;gap:16px;align-items:flex-end}
.dtop .poster{width:104px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dtop h1{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stats{display:flex;gap:18px;padding:14px 20px 0;font-size:13px;color:var(--fg2)}
.stats b{color:var(--fg);font-weight:800}
.genres{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 0}
.genres .chip{padding:8px 15px}
.syn{padding:16px 20px 0;color:var(--fg2);font-size:13.5px;line-height:1.55}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{padding:6px 20px 0;font-weight:700;font-size:13px}
.info-box{margin:16px 20px 0;background:var(--c);border-radius:18px;padding:6px 16px}
.info-box div{display:flex;padding:10px 0;font-size:13px}
.info-box span{width:110px;color:var(--fg2);flex:none}
.info-box b{font-weight:600}
.eps{display:flex;flex-direction:column}
.ep{display:flex;gap:12px;align-items:center;padding:8px 20px;text-align:left;width:100%}
.ep .th{width:112px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex:none;position:relative}
.ep .th .ph{position:absolute;inset:0}
.ep .th .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--primary)}
.ep .tx{flex:1;min-width:0}
.ep .tx b{display:block;font-size:14px}
.ep .tx span{font-size:12px;color:var(--fg2)}
.ep .dl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none;position:relative}
.ep .dl:hover{background:var(--c-high)}
.ring{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--outline-v) 0)}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg)}
/* player */
.screen{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;flex:none}
.screen .scene{position:absolute;inset:0;transition:filter .3s}
.screen.paused .scene{filter:brightness(.55)}
.screen .ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent 35%,transparent 55%,rgba(0,0,0,.7));transition:opacity .25s}
.screen .ctl.hide{opacity:0;pointer-events:none}
.ptop{display:flex;align-items:center;gap:4px;padding:6px 6px 0}
.ptop .ttl{flex:1;min-width:0;line-height:1.15}
.ptop .ttl b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .ttl span{font-size:11px;opacity:.85}
.ptop .iconbtn{width:38px;height:38px;color:#fff}
.pmid{display:flex;justify-content:center;align-items:center;gap:22px}
.pmid button{color:#fff;display:grid;place-items:center}
.pmid .big{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.pbot{padding:0 12px 8px}
.pbot .tm{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.seek{position:relative;height:18px;display:flex;align-items:center;cursor:pointer}
.seek::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.seek i{position:absolute;left:0;height:3px;border-radius:2px;background:var(--primary)}
.seek u{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--primary);margin-left:-6px}
.skip{position:absolute;right:12px;bottom:46px;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:7px 14px;font-weight:700;font-size:12px;z-index:2}
.ptitle{padding:16px 20px 0}
.ptitle h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ptitle span{color:var(--primary);font-weight:700;font-size:13px}
.navrow{display:flex;gap:10px;padding:14px 20px 0}
.navrow .btn{height:46px;border-radius:14px;font-size:14px}
.navrow .btn.ghost{background:var(--c);color:var(--fg2)}
.lbl{padding:20px 20px 8px;font-weight:700;font-size:13px}
.qrow{display:flex;gap:8px;padding:0 20px;flex-wrap:wrap}
.qrow .chip{padding:7px 14px;border-radius:10px}
.qrow .chip[aria-pressed=true]{background:var(--primary-c);color:var(--on-primary-c);border-color:var(--primary-c)}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow .e{flex:none;width:136px;text-align:left}
.hrow .th{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative}
.hrow .th .ph{position:absolute;inset:0}
.hrow .th em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;background:rgba(0,0,0,.45)}
.hrow .e b{display:block;margin-top:6px;font-size:13px}
.hrow .e[aria-current=true] b{color:var(--primary)}
/* library */
.seg{display:flex;margin:6px 20px 14px;background:var(--c-low);border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-weight:600;color:var(--fg2);font-size:13px}
.seg button[aria-selected=true]{background:var(--primary-c);color:var(--on-primary-c);font-weight:800}
.empty{text-align:center;padding:60px 36px;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.hist{display:flex;gap:14px;padding:8px 20px;width:100%;text-align:left;align-items:center}
.hist .th{width:124px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;flex:none}
.hist .th .ph{position:absolute;inset:0}
.hist .th .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--primary)}
.hist b{display:block;font-size:14px;line-height:1.25}
.weekcard{margin:0 20px 14px;background:var(--c);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;width:calc(100% - 40px);text-align:left}
.weekcard small{color:var(--fg2);display:block;font-size:12px}
.weekcard b{font-size:18px}
/* settings */
.sg{padding:22px 20px 6px;color:var(--primary);font-weight:700;font-size:13px}
.set{display:flex;gap:16px;align-items:center;padding:12px 20px;width:100%;text-align:left}
.set .ic{color:var(--fg2)}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-weight:600;font-size:15px}
.set .tx span{display:block;color:var(--fg2);font-size:12.5px;line-height:1.35;margin-top:2px}
.sw{width:52px;height:30px;border-radius:15px;background:var(--c-highest);border:2px solid var(--outline);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.2s}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true]::after{left:25px;width:20px;height:20px;top:3px;background:var(--on-primary)}
.sgm{display:flex;margin:6px 20px 6px;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.sgm button{flex:1;padding:10px 0;font-weight:600;font-size:13px;border-left:1px solid var(--outline)}
.sgm button:first-child{border-left:0}
.sgm button[aria-pressed=true]{background:var(--primary-c);color:var(--on-primary-c);font-weight:800}
.sgm.ind button{flex:none;padding:10px 18px}
/* manga */
.mhero{display:flex;gap:16px;padding:6px 20px 0}
.mhero .poster{width:112px;flex:none}
.chap{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;width:100%;text-align:left;border-bottom:1px solid var(--outline-v)}
.chap b{font-size:14px}
.chap small{display:block;color:var(--fg2);font-size:12px;margin-top:2px}
.chap.read b{color:var(--fg2);font-weight:500}
.reader{background:#000;color:#fff}
.rbar{position:absolute;inset:0 0 auto;z-index:6;display:flex;align-items:center;gap:6px;padding:8px 10px;background:linear-gradient(rgba(0,0,0,.8),transparent);transition:transform .25s}
.rbar.hide{transform:translateY(-110%)}
.rbar .t{flex:1;min-width:0;line-height:1.15}
.rbar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rbar .t span{font-size:11px;opacity:.8}
.rbar .iconbtn{color:#fff}
.pg-img{position:relative;aspect-ratio:3/4.2;width:100%;overflow:hidden}
.pg-img .art{position:absolute;inset:0}
.bubble{position:absolute;background:#fff;color:#111;border-radius:50%/60%;padding:10px 14px;font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700;font-size:12px;line-height:1.2;text-align:center;max-width:46%;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.rpill{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(20,18,26,.85);backdrop-filter:blur(8px);color:#fff;border-radius:18px;padding:7px 16px;font-weight:700;font-size:12px;z-index:6;font-variant-numeric:tabular-nums}
.rend{padding:36px 24px 70px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
/* toast, sheet, offline */
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:30;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.toast.on{transform:none;opacity:1}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;animation:f .2s}
.sheet{background:var(--c-high);width:100%;border-radius:28px 28px 0 0;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));max-height:75%;overflow-y:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:4px auto 10px;opacity:.6}
.sheet h3{margin:6px 20px 12px;font-size:17px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:13px 24px;font-weight:600}
.sheet .opt[aria-checked=true]{color:var(--primary)}
.dialog{background:var(--c-high);margin:auto 28px;border-radius:28px;padding:24px;animation:f .2s}
.dialog h3{margin:0 0 10px;font-size:20px}
.dialog p{margin:0 0 20px;color:var(--fg2);font-size:14px}
.dialog .a{display:flex;justify-content:flex-end;gap:8px}
.dialog .a button{padding:10px 16px;border-radius:20px;font-weight:700;color:var(--primary)}
.scrim.mid{align-items:center}
@keyframes f{from{opacity:0}}
.note{margin:14px 20px;padding:12px 14px;border-radius:14px;background:var(--sec-c);color:var(--secondary);font-size:12px;font-weight:600}
.sort{display:inline-flex;align-items:center;gap:6px;background:var(--c-high);padding:8px 12px;border-radius:12px;font-weight:600;font-size:13px}
.sort .ic{width:18px;height:18px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
.hd h2{margin:0;font-size:16px;font-weight:700}
.about{padding:24px 20px;color:var(--fg2);font-size:12px;line-height:1.6;text-align:center}

/* account, home blocks */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;overflow:hidden;flex:none;border:0}
.av.lg{width:56px;height:56px;font-size:18px;border:2px solid var(--outline-v)}
.av.sm{width:30px;height:30px;font-size:11px}
nav.tabs .av.sm{width:26px;height:26px;font-size:10px}
.acct{margin:0 16px;border:1px solid var(--outline-v);background:var(--c-low);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;cursor:pointer}
.an{display:flex;flex-direction:column;gap:4px;min-width:0}
.an b{font-size:17px;font-weight:800}
.lv{align-self:flex-start;background:var(--c-high);color:var(--fg2);font-weight:800;font-size:12px;padding:3px 12px;border-radius:12px;display:inline-block}
.bell{position:relative;width:48px;height:48px;border-radius:50%;background:var(--c-high);display:grid;place-items:center}
.bell i{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#e5232e;color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.exp{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--fg2)}
.exp .bar{flex:1;height:8px;border-radius:4px;background:var(--c-highest);overflow:hidden}
.exp .bar i{display:block;height:100%;min-width:4px;background:var(--primary);border-radius:4px}
.exp b{color:var(--fg)}
.qrow2{display:flex;gap:10px;margin:12px 16px 0}
.srch,.mini{height:48px;border-radius:16px;border:1px solid var(--outline-v);background:var(--c-low);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600}
.srch{flex:1;min-width:0;color:var(--fg2);font-size:14px}
.mini{font-weight:800;color:var(--fg)}
.mini .ic{color:#4ade80}
.clan{margin:12px 16px 0;border:1px solid var(--outline-v);background:var(--c-low);border-radius:16px;padding:8px 10px 10px}
.ch{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--fg2)}
.ch .ic{color:#f5b942}
.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px;animation:f .3s}
.ci{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border-radius:12px;background:var(--c);border:1px solid var(--outline-v);min-width:0}
.ci.r1{border-color:#c9a24a;background:linear-gradient(var(--c),var(--c))}
.ci.r2{border-color:#9aa3b2}
.ci.r3{border-color:#b27a4b}
.ci .rk{font-size:10px;font-weight:800;color:var(--fg2)}
.ci.r1 .rk{color:#d9a93c}
.ci .cn{font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .clv{font-size:11px;font-weight:700;color:var(--fg2)}
.prem{margin:10px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;border:1px solid var(--tertiary);background:var(--c-low);text-align:left}
.prem .pb{display:inline-flex;align-items:center;gap:6px;background:var(--tertiary);color:var(--bg);font-weight:800;padding:7px 12px;border-radius:10px;font-size:13px}
.prem .pt3{flex:1;font-size:13px;color:var(--fg2)}
.prem .pt3 b{color:var(--fg)}
.sec.sm{padding-top:16px}
.sec.sm h2{font-size:15px}
.pillb{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--outline-v);background:var(--c-low);color:var(--fg2)!important;padding:6px 8px 6px 12px;border-radius:16px;font-size:12px!important}
.lw{flex:none;width:100px;text-align:left}
.lw .th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden}
.lw .th .ph{position:absolute;inset:0}
.lw .eps{position:absolute;left:6px;bottom:7px;color:#fff;font-weight:800;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.lw .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--primary)}
.lw .lt{display:block;margin-top:5px;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchat{margin:14px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;border:1px solid var(--outline-v);background:var(--c-low);text-align:left}
.gchat .gt{display:inline-flex;align-items:center;gap:5px;background:var(--c-high);color:var(--tertiary);font-weight:800;font-size:12px;padding:6px 10px;border-radius:10px}
.gchat .gm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--fg2)}
.gchat .gm b{color:var(--primary)}
.gchat .gb{font-style:normal;background:#e5232e;color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
.rate{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;display:flex;gap:3px;align-items:center}
.rate .ic{color:#f5b942}
.fab{position:absolute;right:16px;bottom:84px;width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:15}
/* timeline + profile */
.thead{display:flex;gap:14px;align-items:center;padding:12px 12px 0 20px}
.thx{padding:12px 20px 0}
.cur{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px}
.cur>div{display:flex;gap:12px;align-items:center;border:1px solid var(--outline-v);background:var(--c-low);border-radius:18px;padding:12px 16px;color:var(--tertiary)}
.cur span{display:flex;flex-direction:column;color:var(--fg2);font-size:13px}
.cur b{color:var(--fg);font-size:18px;line-height:1.1}
.comp{display:flex;gap:8px}
.comp input{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--outline-v);background:var(--c-low);color:var(--fg);font:inherit;padding:0 16px;outline:0}
.comp input:focus{border-color:var(--primary)}
.post{display:flex;gap:12px;padding:16px 20px 6px}

.ph1{display:flex;align-items:center;gap:8px}
.ph1 b{font-size:15px}
.ph1 .tm{margin-left:auto;font-size:12px}
.vf{color:var(--error);display:inline-flex}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.tg{border:1.5px solid var(--outline);border-radius:14px;padding:2px 10px;font-weight:800;font-size:12px}

.ref b{display:block;font-size:15px;font-weight:600}
.ref span span{color:var(--fg2);font-size:13px}
.pt2{margin:6px 0 10px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.media{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;max-width:100%}
.plb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#fff;color:#222;display:grid;place-items:center}
.rep{color:var(--tertiary);font-weight:700;margin:10px 0 14px}
.camb{position:absolute;right:-2px;top:-2px;width:40px;height:40px;border-radius:50%;background:#2d8cf0;color:#fff;display:grid;place-items:center}

.hearts b{color:var(--fg)}

.pst div:first-child{border-left:0}
.pst b{color:var(--fg);font-size:22px;font-weight:800}

.pitem{padding:12px 20px}
.mp{display:flex;align-items:center;gap:10px;margin-top:8px}
.pbtn{width:26px;height:26px;border-radius:50%;background:var(--fg2);color:var(--bg);display:grid;place-items:center}
.mb{flex:1;height:3px;background:var(--outline-v);border-radius:2px;overflow:hidden}

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function art(id,ang){const h=hue(id),h2=(h+55+hue(id+'x')%60)%360;return `background:radial-gradient(circle at 25% 20%,hsl(${h2} 80% 62%) 0,transparent 55%),linear-gradient(${ang||155}deg,hsl(${h} 70% 38%),hsl(${(h+300)%360} 60% 16%))`}

function poster(a,o={}){return `<div class="poster" style="${art(a.id)}"><span class="ph" aria-hidden="true">${esc(initials(a.title))}</span>${o.live&&a.status==='ONGOING'?'<span class="badge"><i></i>Tayang</span>':''}${o.new?'<span class="badge new">BARU</span>':''}${o.nw?'<span class="badge new" style="left:0;border-radius:0 8px 8px 0">New</span>':''}${o.rate?`<span class="rate">${ic('star',12)}${rate(a)}</span>`:''}${o.title?`<span class="pt">${esc(a.title)}</span>`:''}</div>`}
function rate(a){return (6+hue(a.id)%29/10).toFixed(2).replace('.',',')}

const TABS=[['home','Beranda','home'],['explore','Jelajah','explore'],['manga','Manga','book'],['schedule','Jadwal','cal'],['timeline','Timeline','user']];
let timers=[];
function clearTimers(){timers.forEach(clearInterval);timers=[]}
function route(){
  clearTimers();
  const h=(location.hash||'#home').slice(1);const [name,...rest]=h.split('-');
  const arg=rest.join('-');
  const tabNames=TABS.map(t=>t[0]);
  const cur=tabNames.includes(name)?name:(name==='mdetail'||name==='read'?'manga':name==='library'||name==='profile'?'timeline':'home');
  const full=['play','read'].includes(name);
  $('#tabs').style.display=full?'none':'flex';
  $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-go="${k}" aria-current="${k===cur}"><span class="pill">${i==='user'?`<span class="av sm" style="${art('seika')}">SK</span>`:ic(i)}</span>${l}</button>`).join('');
  const old=$('#view');const v=old.cloneNode(false);old.replaceWith(v);v.className='view';$('#fabs').innerHTML='';
  const R={home:Home,explore:Explore,manga:Manga,schedule:Schedule,library:Library,timeline:Timeline,profile:Profile,detail:Detail,play:Player,settings:Settings,mdetail:MDetail,read:Reader}[name]||Home;
  v.innerHTML='';R(v,arg);
  if(!['home','explore','manga','schedule','library'].includes(name)||true)v.scrollTop=0;
}
window.addEventListener('hashchange',route);
function go(h){location.hash=h}
const back=()=>{if(history.length>1)history.back();else go('home')};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=link][data-go]'))go(e.target.dataset.go)});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-bell]')){e.stopPropagation();sheet('Notifikasi ('+(S.notif||0)+')',NOTIFS,'',()=>{});S.notif=0;save();const b=document.querySelector('.bell i');if(b)b.remove();return}
  const c=e.target.closest('[data-chat]');if(c){chatSheet();return}
  const t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
  const g=e.target.closest('[data-go]');if(g){save();go(g.dataset.go);return}
  const b=e.target.closest('[data-back]');if(b){save();back();return}
});

/* ---------- sheets / dialogs ---------- */
function sheet(title,opts,sel,pick){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h3>${esc(title)}</h3>${opts.map(([v,l])=>`<button class="opt" role="radio" aria-checked="${v===sel}" data-v="${esc(v)}">${esc(l)}${v===sel?ic('check',20):''}</button>`).join('')}</div>`;
  s.addEventListener('click',e=>{const o=e.target.closest('.opt');if(o){pick(o.dataset.v);s.remove()}else if(e.target===s)s.remove()});
  $('#app').appendChild(s)
}
function dialog(title,body,ok,cb){
  const s=document.createElement('div');s.className='scrim mid';
  s.innerHTML=`<div class="dialog" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="a"><button data-x>Batal</button><button data-ok>${esc(ok)}</button></div></div>`;
  s.addEventListener('click',e=>{if(e.target.closest('[data-ok]')){cb();s.remove()}else if(e.target.closest('[data-x]')||e.target===s)s.remove()});
  $('#app').appendChild(s)
}

const exploreState={q:'',type:'Semua',genre:[],sort:'popular'};
function Explore(v){
  const st=exploreState;
  const types=['Semua','Series','Film','Live Action','ONA','OVA','Special'];
  v.innerHTML=`<h1 class="title">Jelajah</h1>
  <label class="search">${ic('search')}<input id="q" type="search" placeholder="Judul, genre, atau studio" value="${esc(st.q)}" autocomplete="off" aria-label="Cari anime"></label>
  <div id="recent"></div>
  <div class="chips" id="types">${types.map(t=>`<button class="chip" aria-pressed="${st.type===t}" data-t="${t}">${t}</button>`).join('')}</div>
  <div class="chips" id="gen" style="padding-top:8px">${GENRES.map(g=>`<button class="chip" aria-pressed="${st.genre.includes(g)}" data-g="${g}">${g}</button>`).join('')}</div>
  <div class="hd"><h2 id="rh">Semua anime</h2><span style="display:flex;gap:8px"><button class="iconbtn" id="rnd" style="width:38px;height:38px;background:var(--c-high)" aria-label="Anime acak">${ic('dice',20)}</button><button class="sort" id="srt">${ic('sort')}<span id="sl"></span>${ic('drop',18)}</button></span></div>
  <div id="res"></div>`;
  const sortNames={popular:'Terpopuler',title:'A–Z',latest:'Terbaru'};
  function draw(){
    const q=st.q.trim().toLowerCase();
    let L=A.filter(a=>(st.type==='Semua'||a.type===st.type)&&st.genre.every(g=>a.genres.includes(g))&&(!q||(a.title+' '+a.jp+' '+a.studio+' '+a.genres.join(' ')).toLowerCase().includes(q)));
    L.sort(st.sort==='title'?(a,b)=>a.title.localeCompare(b.title):st.sort==='latest'?(a,b)=>b.aired.localeCompare(a.aired):(a,b)=>b.views-a.views);
    $('#sl').textContent=sortNames[st.sort];
    $('#rh').textContent=q?`Hasil untuk “${st.q.trim()}”`:'Semua anime';
    $('#res').innerHTML=L.length?`<div class="grid">${L.map(a=>`<button class="card" data-go="detail-${a.id}">${poster(a,{live:1})}<div class="nm">${esc(a.title)}</div><div class="mt">${a.type} · ${a.year}</div></button>`).join('')}</div>`
      :`<div class="empty"><b>Tidak ada hasil</b>Coba kata kunci lain atau longgarkan filter.<br><br><button class="chip" id="clr" style="display:inline-flex">Hapus filter</button></div>`;
    const c=$('#clr');if(c)c.onclick=()=>{st.q='';st.type='Semua';st.genre=[];Explore(v)};
    const r=$('#recent');
    r.innerHTML=(!q&&S.recent.length&&document.activeElement===$('#q'))?`<div class="hd" style="padding-top:2px"><h2 style="font-size:13px;color:var(--fg2)">Pencarian terakhir</h2><button class="sub" id="rc" style="color:var(--primary);font-weight:700">Hapus semua</button></div><div class="chips">${S.recent.map(x=>`<button class="chip" data-r="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';
  }
  draw();
  const qi=$('#q');
  qi.oninput=()=>{st.q=qi.value;draw()};
  qi.onfocus=draw;
  qi.onkeydown=e=>{if(e.key==='Enter'&&st.q.trim()){S.recent=[st.q.trim(),...S.recent.filter(x=>x!==st.q.trim())].slice(0,6);save();qi.blur();draw()}};
  v.addEventListener('mousedown',e=>{const r=e.target.closest('[data-r]');if(r){e.preventDefault();st.q=r.dataset.r;qi.value=st.q;qi.blur();draw()}const rc=e.target.closest('#rc');if(rc){e.preventDefault();S.recent=[];save();draw()}});
  v.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');if(t){st.type=t.dataset.t;$('#types').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===t));draw()}
    const g=e.target.closest('[data-g]');if(g){const k=g.dataset.g;st.genre=st.genre.includes(k)?st.genre.filter(x=>x!==k):[...st.genre,k];g.setAttribute('aria-pressed',st.genre.includes(k));draw()}
    if(e.target.closest('#srt'))sheet('Urutkan',Object.entries(sortNames),st.sort,x=>{st.sort=x;draw()});
    if(e.target.closest('#rnd')){const a=A[Math.floor(Math.random()*A.length)];go('detail-'+a.id)}
  });
}

    <div class="info-box"><div><span>Studio</span><b>${esc(a.studio)}</b></div><div><span>Mulai tayang</span><b>${a.aired}</b></div><div><span>Tahun</span><b>${a.year}</b></div><div><span>Tipe</span><b>${a.type}</b></div><div><span>Total episode</span><b>${a.eps}</b></div></div>
    <div class="hd" style="padding-top:22px"><h2>Episode</h2><span style="display:flex;gap:6px"><button class="sort" id="ord">${epDesc?'Terbaru':'Terlama'}</button></span></div>
    <div class="eps">${L.map(n=>{const k=a.id+'|'+n,d=S.dl[k];const pg=h&&h.ep===n?h.p:(h&&n<h.ep?100:0);return `<div class="ep"><button style="display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left" data-go="play-${a.id}-${n}"><div class="th"><div class="ph" style="${art(a.id+n,120)}"></div>${pg?`<i class="pg" style="width:${pg}%"></i>`:''}</div><div class="tx"><b>Episode ${n}</b><span>${pg>=100?'Sudah ditonton':a.status==='ONGOING'&&n===list[list.length-1]?'Baru · minggu ini':'Durasi 24 mnt'}</span></div></button><button class="dl" data-dl="${n}" aria-label="Download episode ${n}">${d?(d.p>=100?`<span style="color:var(--primary)">${ic('check',22)}</span>`:`<i class="ring" style="--p:${d.p}"></i>`):ic('dl',22)}</button></div>`}).join('')}</div>
    ${a.eps>list.length?`<div class="meta pad" style="padding-top:8px;padding-bottom:4px">Menampilkan ${list.length} dari ${a.eps} episode pada preview ini.</div>`:''}
    <div class="sec"><h2>Anime Serupa</h2></div><div class="row" style="padding-bottom:30px">${similar.map(x=>`<button class="card" data-go="detail-${x.id}">${poster(x)}<div class="nm">${esc(x.title)}</div></button>`).join('')}</div>`;
  };
  draw();
  v.onclick=e=>{
    if(e.target.closest('#fv')){toggleFav(a.id);draw()}
    if(e.target.closest('#mr')){open=!open;draw()}
    if(e.target.closest('#ord')){epDesc=!epDesc;draw()}
    const g=e.target.closest('[data-genre]');if(g){exploreState.genre=[g.dataset.genre];exploreState.q='';exploreState.type='Semua';go('explore')}
    const d=e.target.closest('[data-dl]');if(d){startDl(a,+d.dataset.dl,draw)}
  };
}
function startDl(a,n,after){
  const k=a.id+'|'+n;
  if(S.dl[k]){
    if(S.dl[k].p>=100)dialog('Hapus download?','File episode ini akan dihapus dari perangkat.','Hapus',()=>{delete S.dl[k];save();toast(`Download Episode ${n} dihapus`);after&&after()});
    else{delete S.dl[k];save();after&&after()}
    return;
  }
  S.dl[k]={p:0};toast(`Download ${S.q} dimulai`);after&&after();
  const iv=setInterval(()=>{const d=S.dl[k];if(!d){clearInterval(iv);return}d.p=Math.min(100,d.p+8+Math.random()*12|0);save();if(d.p>=100){clearInterval(iv);toast(`Episode ${n} tersimpan offline`)}after&&after()},500);
}

/* ---------- PLAYER ---------- */
function Player(v,arg){
  const m=arg.match(/^(.*)-(\d+)$/);const a=byId[m?m[1]:arg];let ep=m?+m[2]:1;
  if(!a){back();return}
  const list=eps(a);let t=0,playing=true,quality=S.q,dur=1440,hideT;
  const hi=S.hist.find(x=>x.id===a.id);
  if(hi&&hi.ep===ep)t=Math.round(dur*hi.p/100);
  const mm=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const idx=list.indexOf(ep);
  v.className='view';
  v.innerHTML=`<div class="dbar" style="display:none"></div>
  <div class="screen" id="sc"><div class="scene" style="${art(a.id+ep,130)}"><div class="ph" style="position:absolute;inset:0;display:grid;place-items:center;font-size:84px;font-weight:800;color:rgba(255,255,255,.18);letter-spacing:-.05em">${esc(initials(a.title))}</div></div>
    <div class="ctl" id="ct"><div class="ptop"><button class="iconbtn" data-back aria-label="Kembali">${ic('back')}</button><div class="ttl"><b>${esc(a.title)}</b><span>Episode ${ep} • <span id="qq">${quality}</span></span></div><button class="iconbtn" id="pp2" aria-label="Picture-in-Picture">${ic('pip')}</button><button class="iconbtn" data-go="settings" aria-label="Pengaturan video">${ic('gear')}</button></div>
      <div class="pmid"><button id="pv" aria-label="Episode sebelumnya" ${idx<=0?'disabled style="opacity:.4"':''}>${ic('prev',28)}</button><button id="rw" aria-label="Mundur 10 detik">${ic('rew',32)}</button><button class="big" id="pl" aria-label="Jeda">${ic('pause',34)}</button><button id="fw" aria-label="Maju 10 detik">${ic('fwd',32)}</button><button id="nx" aria-label="Episode berikutnya" ${idx>=list.length-1?'disabled style="opacity:.4"':''}>${ic('next',28)}</button></div>
      <div class="pbot"><div class="tm"><span id="tc">00:00</span><span>${mm(dur)}</span></div><div class="seek" id="sk" role="slider" aria-label="Posisi video" tabindex="0"><i id="sf"></i><u id="sh"></u></div></div></div>
    <button class="skip" id="skip" hidden>Lewati OP</button></div>
  <div class="ptitle"><h1>${esc(a.title)}</h1><span>Episode ${ep}</span></div>
  <div class="navrow"><button class="btn ghost" id="b1" ${idx<=0?'disabled':''}>${ic('prev',18)}Sebelumnya</button><button class="btn pri" id="b2" ${idx>=list.length-1?'disabled':''}>Ep ${ep+1}${ic('next',18)}</button></div>
  <div style="padding:12px 20px 0"><button class="btn out" id="dl" style="width:100%">${ic('dl',20)}<span id="dlt">Download untuk ditonton offline</span></button></div>
  <div class="lbl">Kualitas</div><div class="qrow" id="qr">${['720p','480p','360p'].map(q=>`<button class="chip" aria-pressed="${q===quality}" data-q="${q}">${q===quality?ic('check',16):''}${q}</button>`).join('')}</div>
  <div class="lbl">Episode</div><div class="hrow" id="hr" style="padding-bottom:30px">${list.slice(Math.max(0,idx-2),idx+12).map(n=>`<button class="e" data-e="${n}" aria-current="${n===ep}"><div class="th"><div class="ph" style="${art(a.id+n,120)}"></div>${n===ep?'<em>Diputar</em>':''}</div><b>Episode ${n}</b></button>`).join('')}</div>`;
  const ct=$('#ct'),sc=$('#sc');
  const upd=()=>{
    const p=t/dur*100;$('#sf').style.width=p+'%';$('#sh').style.left=p+'%';$('#tc').textContent=mm(t);
    $('#sk').setAttribute('aria-valuenow',Math.round(p));
    $('#pl').innerHTML=ic(playing?'pause':'play',34);sc.classList.toggle('paused',!playing);
    $('#skip').hidden=!(t>=10&&t<=100);
    const e=S.hist.find(x=>x.id===a.id);const rec={id:a.id,ep,p:Math.min(100,Math.round(p))};
    if(e)Object.assign(e,rec);else S.hist.unshift(rec);
  };
  const wake=()=>{ct.classList.remove('hide');clearTimeout(hideT);if(playing)hideT=setTimeout(()=>ct.classList.add('hide'),3000)};
  const goEp=n=>{save();location.hash=`play-${a.id}-${n}`};
  timers.push(setInterval(()=>{if(playing){t=Math.min(dur,t+1);upd();if(t>=dur){playing=false;if(S.auto&&idx<list.length-1){toast(`Memutar Episode ${ep+1}…`);setTimeout(()=>goEp(ep+1),1200)}}if(t%5===0)save()}},1000));
  sc.onclick=e=>{if(e.target.closest('button')||e.target.closest('.seek'))return;if(ct.classList.contains('hide'))wake();else ct.classList.add('hide')};
  $('#pl').onclick=()=>{playing=!playing;upd();wake()};
  $('#rw').onclick=()=>{t=Math.max(0,t-10);upd();wake()};
  $('#fw').onclick=()=>{t=Math.min(dur,t+10);upd();wake()};
  $('#skip').onclick=()=>{t=Math.max(t,95);upd();toast('Intro dilewati')};
  $('#pp2').onclick=()=>toast('PiP hanya tersedia di aplikasi Android');
  const seek=e=>{const r=$('#sk').getBoundingClientRect();t=Math.round(dur*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)));upd();wake()};
  $('#sk').onclick=seek;
  $('#sk').onkeydown=e=>{if(e.key==='ArrowRight'){t=Math.min(dur,t+10);upd()}if(e.key==='ArrowLeft'){t=Math.max(0,t-10);upd()}};
  $('#pv').onclick=$('#b1').onclick=()=>idx>0&&goEp(list[idx-1]);
  $('#nx').onclick=$('#b2').onclick=()=>idx<list.length-1&&goEp(list[idx+1]);
  $('#qr').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;quality=b.dataset.q;$('#qq').textContent=quality;$('#qr').querySelectorAll('.chip').forEach(c=>{const on=c===b;c.setAttribute('aria-pressed',on);c.innerHTML=(on?ic('check',16):'')+c.dataset.q});toast('Kualitas: '+quality)};
  $('#hr').onclick=e=>{const b=e.target.closest('[data-e]');if(b)goEp(+b.dataset.e)};
  const dlSync=()=>{const d=S.dl[a.id+'|'+ep];$('#dlt').textContent=d?(d.p>=100?`Tersimpan offline • ${S.q}`:`Mengunduh ${d.p}%`):'Download untuk ditonton offline'};
  $('#dl').onclick=()=>startDl(a,ep,dlSync);dlSync();
  upd();wake();
}

/* ---------- MANGA ---------- */
const mState={q:'',genre:''};
function Manga(v){
  const st=mState;const gen=['Aksi','Romansa','Horor','Komedi','Fantasi','Isekai'];
  const gmap={Aksi:'Action',Romansa:'Romance',Horor:'Horror',Komedi:'Comedy',Fantasi:'Fantasy',Isekai:'Isekai'};
  const mc=m=>`<button class="card" data-go="mdetail-${m.id}">${poster({id:m.id,title:m.title,status:''},{})}<div class="nm">${esc(m.title)}</div><div class="mt">${m.type} · ${m.src}</div></button>`;
  const draw=()=>{
    const q=st.q.trim().toLowerCase();
    const f=M.filter(m=>(!q||(m.title+m.author).toLowerCase().includes(q))&&(!st.genre||m.genres.includes(gmap[st.genre])));
    const filtering=q||st.genre;
    const cont=Object.keys(S.read).map(k=>mById[k]).filter(Boolean);
    $('#mb').innerHTML=filtering?(f.length?`<div class="grid">${f.map(mc).join('')}</div>`:`<div class="empty"><b>Tidak ada hasil</b>Coba kata kunci lain atau longgarkan filter.</div>`)
    :`${cont.length?`<div class="sec"><h2>Lanjut baca</h2></div><div class="row">${cont.map(mc).join('')}</div>`:''}
     <div class="sec"><h2>Populer di Indonesia</h2></div><div class="row">${M.slice(0,6).map(mc).join('')}</div>
     <div class="sec"><h2>Trending dunia</h2></div><div class="row">${[...M].reverse().slice(0,6).map(mc).join('')}</div>
     <div class="sec"><h2>Baru update</h2></div><div class="grid" style="padding-top:0">${M.slice(2,8).map(mc).join('')}</div>`;
  };
  v.innerHTML=`<h1 class="title">Manga</h1>
  <label class="search">${ic('search')}<input id="mq" type="search" placeholder="Cari manga" value="${esc(st.q)}" autocomplete="off" aria-label="Cari manga"></label>
  <div class="chips"><button class="chip" aria-pressed="${!st.genre}" data-mg="">Semua</button>${gen.map(g=>`<button class="chip" aria-pressed="${st.genre===g}" data-mg="${g}">${g}</button>`).join('')}</div>
  <div id="mb" style="padding-bottom:20px"></div>
  <div class="note">Preview: sumber manga asli (MangaDex, Shinigami, Komiku, WEBTOON) tidak dimuat di versi web. Judul di sini contoh.</div>`;
  draw();
  $('#mq').oninput=e=>{st.q=e.target.value;draw()};
  v.addEventListener('click',e=>{const g=e.target.closest('[data-mg]');if(g){st.genre=g.dataset.mg;v.querySelectorAll('[data-mg]').forEach(c=>c.setAttribute('aria-pressed',c===g));draw()}});
}
function MDetail(v,id){
  const m=mById[id];if(!m){v.innerHTML='<div class="empty"><b>Manga tidak ditemukan.</b></div>';return}
  const fav=S.mfav.includes(m.id);const n=Math.min(m.chaps,40);const rd=S.read[m.id];
  const chs=Array.from({length:n},(_,i)=>n-i);let desc=true;let more=false;
  const draw=()=>{
    const L=desc?chs:[...chs].reverse();
    v.innerHTML=`<div class="dbar"><button class="iconbtn" data-back aria-label="Kembali" style="background:rgba(0,0,0,.35);color:#fff">${ic('back')}</button></div>
    <div class="dhead" style="min-height:280px;padding-bottom:6px"><div class="bg" style="${art(m.id+'b',200)}"></div><div class="fade"></div>
    <div class="dtop"><div style="width:112px;flex:none">${poster({id:m.id,title:m.title})}</div><div><h1>${esc(m.title)}</h1><div class="meta">${esc(m.author)}</div><div class="meta" style="margin-top:4px">${m.type} · ${m.status} · ${m.year}</div></div></div></div>
    <div style="display:flex;gap:10px;padding:14px 20px 0"><button class="btn pri" data-go="read-${m.id}-${rd||chs[chs.length-1]}">${ic('play')}${rd?'Lanjut Ch. '+rd:'Mulai baca'}</button><button class="sq" id="mf" aria-pressed="${fav}" aria-label="Favorit" style="${fav?'color:var(--secondary)':''}">${ic(fav?'heart':'heartO')}</button></div>
    <div class="genres">${m.genres.map(g=>`<span class="chip">${g}</span>`).join('')}</div>
    <div class="syn ${more?'':'clamp'}">${esc(m.syn)}</div><button class="more" id="mm">${more?'Ringkas':'Selengkapnya'}</button>
    <div class="info-box"><div><span>Status</span><b>${m.status}</b></div><div><span>Tipe</span><b>${m.type}</b></div><div><span>Tahun</span><b>${m.year}</b></div><div><span>Pengarang</span><b>${esc(m.author)}</b></div><div><span>Sumber</span><b>${m.src}</b></div></div>
    <div class="hd" style="padding-top:22px"><h2>Chapter</h2><button class="sort" id="mo">${desc?'Terbaru':'Terlama'}</button></div>
    ${L.map(c=>`<button class="chap ${rd&&c<=rd?'read':''}" data-go="read-${m.id}-${c}"><div><b>Ch. ${c}</b><small>${rd&&c<=rd?'Sudah dibaca':'Indonesia'}</small></div>${ic('dl',20)}</button>`).join('')}
    <div style="height:30px"></div>`;
  };
  draw();
  v.onclick=e=>{
    if(e.target.closest('#mf')){const i=S.mfav.indexOf(m.id);if(i>=0)S.mfav.splice(i,1);else S.mfav.push(m.id);save();toast(i>=0?'Dihapus dari favorit':'Ditambahkan ke favorit');draw()}
    if(e.target.closest('#mm')){more=!more;draw()}
    if(e.target.closest('#mo')){desc=!desc;draw()}
  };
}
function Reader(v,arg){
  const mt=arg.match(/^(.*)-(\d+)$/);const m=mById[mt?mt[1]:arg];const ch=mt?+mt[2]:1;if(!m){back();return}
  const total=Math.min(m.chaps,40);const pages=8;let tr=false,barHide=false;
  v.className='view reader';S.read[m.id]=ch;save();
  const lines=['Akhirnya sampai juga…','Jangan menoleh ke belakang.','Aku tidak akan kalah lagi!','Kau yakin dengan keputusanmu?','Tunggu, suara apa itu?','Ini baru permulaan.'];
  const draw=()=>{
    v.innerHTML=`<div class="rbar" id="rb"><button class="iconbtn" data-back aria-label="Kembali">${ic('back')}</button><div class="t"><b>${esc(m.title)}</b><span>Ch. ${ch} · Sumber: ${m.src}</span></div><button class="iconbtn" id="tr" aria-label="Terjemahkan" aria-pressed="${tr}" style="${tr?'color:var(--primary)':''}">${ic('trans')}</button></div>
    ${Array.from({length:pages},(_,i)=>`<div class="pg-img" data-p="${i+1}"><div class="art" style="${art(m.id+ch+i,i*47%360)}"></div><span style="position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:30px;opacity:.22">${i+1}</span>${tr&&i%2===0?`<div class="bubble" style="left:${12+i*5%30}%;top:${14+i*7%40}%">${lines[i%lines.length]}</div>`:''}</div>`).join('')}
    <div class="rend"><b>Akhir Ch. ${ch}</b><span class="meta">${ch<total?'':'Ini chapter terakhir yang tersedia'}</span>${ch<total?`<button class="btn pri" style="flex:none;padding:0 28px" data-go="read-${m.id}-${ch+1}">Chapter berikutnya</button>`:''}${ch>1?`<button class="btn out" style="flex:none;padding:0 28px" data-go="read-${m.id}-${ch-1}">Chapter sebelumnya</button>`:''}<button class="btn out" style="flex:none;padding:0 28px" data-go="mdetail-${m.id}">Daftar chapter</button></div>
    <div class="rpill" id="rp">1 / ${pages}</div>`;
  };
  draw();
  v.onscroll=()=>{const imgs=v.querySelectorAll('.pg-img');let cur=1;imgs.forEach(im=>{if(im.offsetTop-v.scrollTop<v.clientHeight*.5)cur=+im.dataset.p});const p=$('#rp');if(p)p.textContent=`${cur} / ${pages}`};
  let lastY=0;v.addEventListener('scroll',()=>{const y=v.scrollTop;const rb=$('#rb');if(rb)rb.classList.toggle('hide',y>lastY&&y>80);lastY=y},{passive:true});
  v.onclick=e=>{
    if(e.target.closest('#tr')){tr=!tr;toast(tr?'Menerjemahkan ke Indonesia (contoh)':'Tampilkan asli');const y=v.scrollTop;draw();v.scrollTop=y;return}
    if(e.target.closest('button'))return;
    const rb=$('#rb');if(rb)rb.classList.toggle('hide')
  };
}

function Settings(v){

  v.innerHTML=`<div style="padding:8px 10px"><button class="iconbtn" data-back aria-label="Kembali">${ic('back')}</button></div>

  <div class="sg">Pemutar</div>
  <div class="set" style="padding-bottom:0">${ic('hd')}<span class="tx"><b>Kualitas default</b></span></div>
  ${grp('q',[['360p','360p'],['480p','480p'],['720p','720p'],['1080p','1080p']],'ind')}
  <div class="set" style="padding-bottom:0">${ic('bars')}<span class="tx"><b>Kualitas di data seluler</b></span></div>
  ${grp('mq',[['follow','Ikuti default'],['360p','360p'],['480p','480p'],['720p','720p']],'ind')}
  ${sw('auto','next','Putar otomatis episode berikutnya','Hitung mundur 6 detik di akhir episode')}
  ${sw('pip','pip','Picture-in-Picture otomatis','Video mengecil saat kamu keluar aplikasi')}
  ${sw('bgaudio','play','Putar audio di latar','Suara tetap jalan saat layar mati atau aplikasi ditinggal')}
  ${sw('skipop','next','Lewati OP otomatis','Untuk anime yang OP-nya sudah kamu tandai di pemutar')}
  ${sw('jump','fwd','Tombol +85 detik','Lompat 85 detik di awal episode yang OP-nya belum ditandai')}
  <div class="sg">Notifikasi</div>
  ${sw('notify','bell','Notifikasi episode baru','Cek anime favorit yang masih tayang setiap 6 jam')}
  ${sw('notifyRel','bell','Notifikasi rilis anime','Episode baru dari semua anime yang sedang tayang, bukan hanya favorit')}
  <div class="sg">Unduhan</div>
  ${sw('wifi','wifi','Download hanya lewat Wi-Fi','Hemat kuota, download menunggu sampai tersambung Wi-Fi')}
  <div class="sg">Data</div>
  <button class="set" data-act="hist">${ic('trash')}<span class="tx"><b>Hapus riwayat tontonan</b><span>Progres semua episode akan hilang</span></span></button>
  <button class="set" data-act="all">${ic('trash')}<span class="tx"><b>Hapus semua data</b><span>Favorit, riwayat, pencarian, pengaturan, dan file unduhan</span></span></button>
  <div class="sg">Tentang</div>
  <div class="set">${ic('info')}<span class="tx"><b>Kagenime ${VERSION}</b><span>Versi pertama · preview web</span></span></div>
  <div class="set">${ic('cloud')}<span class="tx"><b>Konten disediakan pihak ketiga</b><span>Aplikasi ini tidak meng-host video apa pun</span></span></div>
  <div class="about">Ini preview web dari aplikasi Android. Data, poster, dan pemutar adalah contoh; pengaturan tersimpan di browser ini saja.</div>`;
  v.onclick=e=>{
    const s=e.target.closest('[data-sw]');if(s){const k=s.dataset.sw;S[k]=!S[k];save();applyTheme();s.querySelector('.sw').setAttribute('aria-checked',S[k]);if(k==='dyn')toast('Warna dinamis hanya berlaku di Android 12+');return}
    const b=e.target.closest('[data-val]');if(b){const g=b.parentElement.dataset.grp;S[g]=b.dataset.val;save();applyTheme();const y=v.scrollTop;Settings(v);v.scrollTop=y;return}
    const a=e.target.closest('[data-act]');if(a){
      if(a.dataset.act==='hist')dialog('Hapus semua riwayat tontonan?','Progres semua episode akan hilang.','Hapus',()=>{S.hist=[];save();toast('Riwayat dihapus')});
      else dialog('Hapus semua data di perangkat ini?','Favorit, riwayat, pencarian, pengaturan, dan file unduhan akan dihapus.','Hapus',()=>{S=JSON.parse(JSON.stringify(defaults));save();applyTheme();toast('Semua data dihapus');Settings(v)});
    }
  };
}
