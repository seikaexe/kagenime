name: Release Kagenime

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis (contoh: 1.0.0)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Tandai sebagai pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION_CODE=$((1000000 + MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kagenime-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/kagenime-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-fuwanime}" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/kagenime-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=kagenime123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=fuwanime" >> "$GITHUB_ENV"
          fi

      - name: Test and build universal APK
        env:
          UPDATE_REPO: ${{ github.repository }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: gradle testDebugUnitTest assembleRelease -PabiSplits=false --stacktrace

      - name: Collect kagenime.apk
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/kagenime.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/kagenime.apk | tee apksigner.txt
          grep 'certificate SHA-256 digest' apksigner.txt | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: Kagenime-${{ env.VERSION_NAME }}
          path: dist/kagenime.apk

      - name: Upload Release Asset
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/kagenime.apk
          # uncomment baris bawah ini kalau mau pakai softprops action-gh-release
          # (akan menambah file ke release yang sudah dibuat di step sebelumnya)
          # cp dist/kagenime.apk dist/kagenime-${VERSION_NAME}.apk

      - name: Create Git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Kagenime $VERSION_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Kagenime ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/kagenime.apk
          generate_release_notes: true
          make_latest: ${{ !inputs.prerelease }}
          prerelease: ${{ inputs.prerelease || false }}
