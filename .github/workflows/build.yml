name: Build Kagenime APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Prefer repository secrets (if the owner added them). The committed keystore keeps
          # community builds reproducible and signed with the same certificate as releases.
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kagenime-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/kagenime-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-fuwanime}" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore/kagenime-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=kagenime123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=fuwanime" >> "$GITHUB_ENV"
          fi

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test and build universal APK
        env:
          UPDATE_REPO: ${{ github.repository }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: gradle testDebugUnitTest assembleRelease -PabiSplits=false --stacktrace

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.txt" | head -1

      - name: Collect kagenime.apk
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/kagenime-${VERSION_NAME}.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Kagenime-${{ env.VERSION_NAME }}
          path: dist/kagenime.apk
